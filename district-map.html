<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DEHAT — Where We Work: District Vulnerability Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Public+Sans:wght@400..700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<style>
  *{box-sizing:border-box}
  :root{
    --bg:#151009; --bg2:#1d160d; --surface:#241b11; --surface2:#2e2417;
    --text:#f5eede; --dim:#c6b8a3; --faint:#95856f; --border:rgba(245,238,222,.14);
    --land:#2e2417; --land2:#3a2e1d; --ctx:#1e1710; --shadow:rgba(0,0,0,.5);
  }
  html[data-theme="light"]{
    --bg:#fbf7ef; --bg2:#f4efe4; --surface:#ffffff; --surface2:#f4efe4;
    --text:#1f1710; --dim:#5a4f43; --faint:#8a7c6c; --border:rgba(31,23,16,.1);
    --land:#eadfca; --land2:#e0d3b8; --ctx:#f0e9db; --shadow:rgba(31,23,16,.25);
  }
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Public Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
  #wrap{display:grid;grid-template-columns:1fr 400px;height:100vh;transition:background .4s}
  #mapcol{position:relative;overflow:hidden;display:flex;flex-direction:column}
  #maparea{position:relative;flex:1;min-height:0}
  svg{display:block;width:100%;height:100%;cursor:grab}
  svg:active{cursor:grabbing}
  .district{cursor:pointer;transition:stroke-width .15s}
  .dlabel{font-weight:700;fill:var(--text);paint-order:stroke;stroke:var(--bg);pointer-events:none;font-family:"Public Sans"}
  .navbar{flex:none;margin:14px 14px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;z-index:7;background:color-mix(in srgb,var(--surface) 82%,transparent);border:1px solid var(--border);border-radius:16px;padding:8px;backdrop-filter:blur(10px);box-shadow:0 10px 26px -18px var(--shadow)}
  .searchwrap{position:relative;flex:1;max-width:230px;min-width:150px}
  #searchIn{width:100%;padding:9px 12px;border-radius:11px;border:1px solid var(--border);background:transparent;color:var(--text);font:600 13px "Public Sans";outline:none}
  #searchIn::placeholder{color:var(--faint)}
  #searchIn:focus{border-color:#EAAE28}
  .suggest{display:none;position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:11px;overflow:hidden;box-shadow:0 14px 30px -14px var(--shadow);z-index:9}
  .suggest button{display:flex;justify-content:space-between;align-items:baseline;gap:10px;width:100%;padding:9px 12px;background:none;border:none;border-bottom:1px solid var(--border);color:var(--text);font:600 12.5px "Public Sans";cursor:pointer;text-align:left}
  .suggest button:last-child{border-bottom:none}
  .suggest button:hover{background:var(--surface2)}
  .suggest button span{color:var(--faint);font-weight:400;font-size:11px;white-space:nowrap}
  .suggest .nohit{padding:9px 12px;color:var(--faint);font-size:12px}
  .navbar select{padding:9px 10px;border-radius:11px;border:1px solid var(--border);background:transparent;color:var(--text);font:600 12.5px "Public Sans";cursor:pointer;outline:none;max-width:200px}
  .navbar select option{background:var(--surface);color:var(--text)}
  .navbar .chip{background:transparent}
  .rankbox{display:none;position:absolute;top:14px;left:14px;width:300px;max-height:calc(100vh - 200px);overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:14px;z-index:6;box-shadow:0 16px 34px -16px var(--shadow);scrollbar-width:thin}
  .rk-head{display:grid;grid-template-columns:1fr auto;position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--border);z-index:1}
  .rk-head button{padding:10px 14px;background:none;border:none;color:var(--faint);font:700 10.5px "Public Sans";letter-spacing:.08em;text-transform:uppercase;cursor:pointer;text-align:left}
  .rk-head button:hover{color:var(--text)}
  .rk-row{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;width:100%;padding:9px 14px;background:none;border:none;border-bottom:1px solid var(--border);cursor:pointer;text-align:left;color:var(--text)}
  .rk-row:hover,.rk-row.sel{background:var(--surface2)}
  .rk-n{font:700 11px "Public Sans";color:var(--faint)}
  .rk-name{font:600 13px "Public Sans";line-height:1.25}
  .rk-name small{display:block;color:var(--faint);font-size:10.5px;font-weight:400}
  .rk-val{font-family:'Bricolage Grotesque';font-weight:800;font-size:15px}
  .prio-band{margin-top:14px;padding:10px 12px;border-radius:10px;background:rgba(234,174,40,.14);border:1px dashed rgba(234,174,40,.5);color:#EAAE28;font-size:12.5px;font-weight:700;line-height:1.45}
  html[data-theme="light"] .prio-band{color:#8a6410}
  .cmp-row{display:grid;grid-template-columns:1fr 150px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)}
  .cmp-label{font-size:12.5px;font-weight:600;line-height:1.3}
  .cmp-vals{display:grid;grid-template-columns:1fr 1fr;gap:6px;text-align:right}
  .cmp-v{font-family:'Bricolage Grotesque';font-weight:800;font-size:14.5px;white-space:nowrap}
  .cmp-v.worse{color:#D2305C}
  .cmp-v i{font-style:normal;color:var(--faint);font-size:10px;vertical-align:super}
  .cmp-headrow{border-bottom:2px solid var(--border)}
  .cmp-headrow .cmp-vals span{font:700 10.5px "Public Sans";letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
  .toolbar{position:absolute;top:100px;left:14px;right:14px;display:flex;flex-wrap:nowrap;gap:8px;align-items:center;z-index:5;overflow-x:auto;padding:8px;border-radius:14px;background:color-mix(in srgb,var(--surface) 82%,transparent);border:1px solid var(--border);backdrop-filter:blur(8px);scrollbar-width:thin}
  .toolbar::-webkit-scrollbar{height:6px}
  .toolbar::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
  .chip{flex:none;padding:7px 13px;border-radius:999px;border:1px solid var(--border);background:var(--bg2);color:var(--dim);font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .15s}
  .chip:hover{color:var(--text)}
  .chip.on{background:#EAAE28;color:#1f1710;border-color:#EAAE28}
  .legend{position:absolute;bottom:16px;left:16px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:11px;color:var(--dim);z-index:5;max-width:230px}
  .leg-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .leg-title{font-weight:700;color:var(--text)}
  .leg-toggle{display:none;flex:none;width:24px;height:24px;border-radius:7px;border:1px solid var(--border);background:var(--bg2);color:var(--text);font-size:14px;line-height:1;cursor:pointer}
  .legend.min .leg-body{display:none}
  .legbar{height:9px;border-radius:5px;margin:8px 0 4px;background:linear-gradient(90deg,#3d8b6f,#EAAE28,#D2305C,#A92719)}
  .homebtn{position:absolute;bottom:16px;right:16px;z-index:5;display:flex;gap:8px}
  .icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .icon-btn:hover{border-color:#EAAE28}
  .tooltip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px 12px;font-size:12.5px;color:var(--text);box-shadow:0 10px 24px -12px var(--shadow);z-index:20;opacity:0;transition:opacity .12s;max-width:220px}
  .tooltip b{font-family:'Bricolage Grotesque';font-size:14px}
  /* panel */
  #panel{background:var(--surface);border-left:1px solid var(--border);height:100vh;overflow-y:auto;padding:0}
  .p-pad{padding:24px 26px}
  .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
  .p-head h1{font-family:'Bricolage Grotesque';font-weight:800;font-size:30px;line-height:1.02;letter-spacing:-.02em;margin:8px 0 0}
  .p-sub{font-size:13.5px;color:var(--faint);margin-top:4px}
  .why{font-size:14.5px;line-height:1.6;color:var(--dim);margin:16px 0 0}
  .vindex{display:flex;align-items:center;gap:14px;margin:20px 0;padding:16px;border-radius:14px;background:var(--surface2)}
  .vindex .num{font-family:'Bricolage Grotesque';font-weight:800;font-size:38px;line-height:1}
  .nodeblock{margin-top:22px}
  .nodeblock h3{font-family:'Bricolage Grotesque';font-weight:800;font-size:14px;margin:0 0 3px;display:flex;align-items:center;gap:8px}
  .nodeblock .nb-blurb{font-size:12px;color:var(--faint);margin:0 0 12px;line-height:1.45}
  .ind{padding:12px 0;border-bottom:1px solid var(--border)}
  .ind-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .ind-label{font-size:13.5px;font-weight:600;line-height:1.3}
  .ind-val{font-family:'Bricolage Grotesque';font-weight:800;font-size:18px;white-space:nowrap}
  .ind-interp{font-size:12px;color:var(--faint);line-height:1.45;margin:5px 0 8px}
  .bar{height:7px;border-radius:4px;background:var(--surface2);overflow:hidden;position:relative}
  .bar>span{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
  .bar-marks{position:relative;height:27px;margin-top:3px}
  .bar-mark{position:absolute;transform:translateX(-50%);font-size:9px;color:var(--faint);white-space:nowrap}
  .bar-mark::before{content:"";position:absolute;top:-4px;left:50%;width:1px;height:4px;background:var(--faint)}
  .bar-mark.b2{top:14px;color:var(--dim,var(--faint))}
  .bar-mark.b2::before{top:-14px;height:14px}
  .srcrow{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px}
  .src{font-size:10.5px;color:var(--faint)}
  .badge{font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:5px;letter-spacing:.03em}
  .b-exact{background:rgba(85,138,111,.22);color:#7fc79f}
  .b-state{background:rgba(234,174,40,.18);color:#EAAE28}
  .b-na{background:var(--surface2);color:var(--faint)}
  html[data-theme="light"] .b-exact{color:#2f7a54}
  .placeholder{padding:40px 26px;color:var(--faint);font-size:14px;line-height:1.6}
  .placeholder b{color:var(--text);font-family:'Bricolage Grotesque'}
  .disclaim{font-size:11px;color:var(--faint);line-height:1.5;margin-top:8px;padding:12px;border-radius:10px;background:var(--surface2)}
  #panelClose{display:none;position:absolute;top:12px;right:12px;z-index:30;width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:20px;line-height:1;cursor:pointer;align-items:center;justify-content:center;box-shadow:0 8px 20px -10px var(--shadow)}
  @media (max-width:860px){
    #wrap{grid-template-columns:1fr}
    #panel{position:fixed;right:0;top:0;width:min(440px,94vw);transform:translateX(101%);transition:transform .35s;box-shadow:-20px 0 40px -20px var(--shadow);z-index:40}
    #panel.open{transform:none}
    #panel.open #panelClose{display:flex}
    .navbar{gap:6px;padding:7px}
    .searchwrap{flex:1 1 100%;max-width:none}
    .navbar select{flex:1 1 auto;max-width:none}
    .navbar .chip{flex:1 1 auto;text-align:center}
    .rankbox{width:min(300px,calc(100vw - 28px))}
    .legend{max-width:190px;font-size:10.5px;padding:10px 12px}
    .leg-toggle{display:flex;align-items:center;justify-content:center}
    .legend.min{max-width:none}
    .icon-btn{width:44px;height:44px}
  }
  @media (max-width:480px){
    .legend{bottom:12px;left:12px;right:auto}
    .homebtn{bottom:12px;right:12px}
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="mapcol">
    <div class="navbar">
      <div class="searchwrap">
        <input id="searchIn" placeholder="Search District…" autocomplete="off">
        <div class="suggest" id="suggest"></div>
      </div>
      <select id="stateSel" title="Filter by state">
        <option value="all">All States</option>
        <option value="Uttar Pradesh">Uttar Pradesh</option>
        <option value="Maharashtra">Maharashtra</option>
      </select>
      <select id="tierSel" title="DEHAT presence">
        <option value="all">All 23 Districts</option>
        <option value="priority">★ Priority Districts</option>
        <option value="footprint">Programme Footprint</option>
      </select>
      <select id="metricSel" title="Shade districts by indicator"></select>
      <button class="chip" id="rankBtn">Ranking</button>
      <button class="chip" id="cmpBtn">Compare</button>
    </div>
    <div id="maparea">
    <svg id="map"></svg>
    <div class="rankbox" id="rankbox"></div>
    <div class="legend" id="legend"></div>
    <div class="homebtn">
      <button class="icon-btn" id="themeBtn" title="Toggle theme">☀</button>
      <button class="icon-btn" id="zoomIn" title="Zoom in">+</button>
      <button class="icon-btn" id="zoomOut" title="Zoom out">−</button>
      <button class="icon-btn" id="homeBtn" title="Reset view">⤾</button>
    </div>
    <div class="tooltip" id="tt"></div>
    </div>
  </div>
  <div id="panel"><button id="panelClose" aria-label="Close panel">×</button><div id="panelBody"><div class="placeholder" id="ph"></div></div></div>
</div>

<script src="./district-data.js?v=37"></script>
<script>
(function(){
  const A = window.ATLAS;
  const fmtNum = v => (typeof v==='number' && Math.abs(v)>=1000) ? v.toLocaleString('en-IN') : v;
  const fmtVal = (ind, v) => v==null ? '—' : (fmtNum(v) + (ind.unit||''));
  const params = new URLSearchParams(location.search);
  const rootEl = document.documentElement;
  rootEl.setAttribute('data-theme', params.get('theme') === 'light' ? 'light' : 'dark');
  document.getElementById('themeBtn').textContent = rootEl.getAttribute('data-theme') === 'dark' ? '☀' : '☾';

  const svg = d3.select('#map');
  const mapcol = document.getElementById('maparea');
  const gCtx = svg.append('g');   // context countries
  const gIndia = svg.append('g'); // india
  const gPts = svg.append('g');   // districts
  const tt = document.getElementById('tt');

  let W = mapcol.clientWidth, H = mapcol.clientHeight;
  const projection = d3.geoMercator();
  const path = d3.geoPath(projection);
  let selMetric = 'overall';
  let selected = null;
  let stateFilter='all', tierFilter='all', cmpMode=false, cmpSet=[], rankOpen=false, rankSort={key:'val',asc:false};
  const isVisible = d => (stateFilter==='all'||d.state===stateFilter) && (tierFilter==='all'||d.tier===tierFilter);
  let indiaFeature = null, ctxFeatures = null;

  // ----- severity scale -----
  const sevColor = d3.scaleLinear()
    .domain([0, 0.34, 0.67, 1])
    .range(['#3d8b6f', '#EAAE28', '#D2305C', '#A92719']).clamp(true);

  // normalise a district's value for a metric to 0..1 (worse = 1)
  const gapKeys = A.indicators.filter(i => i.worseHigh && !i.noIndex).map(i => i.key);
  function metricNorm(did, key){
    if (key === 'overall'){
      let sum=0, n=0;
      gapKeys.forEach(k => { const r=A.value(did,k); if(r.v!=null){ sum += clampNorm(k, r.v); n++; } });
      return n ? sum/n : 0;
    }
    const r = A.value(did, key); if (r.v==null) return null;
    return clampNorm(key, r.v);
  }
  // per-indicator normalisation range (rough, human-set so colours read well)
  const RANGES = { imr:[20,90], u5mr:[25,115], mmr:[30,170], stunting:[25,55], wasting:[13,23], anaemia:[45,70],
    homebirth:[4,40], noEarlyBF:[55,90], noANC:[30,60], noPostnatal:[10,56], noICDS:[30,76], femaleIlliteracy:[17,68],
    dropout:[8,25], menstrualGap:[13,60], childMarriage:[8,38], adolMothers:[1,9], spousalViolence:[21,38],
    childLabor:[1,13], lowWealth:[5,44], noCleanFuel:[10,83], noCleanWater:[1,9], noSanitation:[6,56], phcGap:[4,51],
    secDropout:[1,15], transitionGap:[5,50], secPTR:[22,52], cwsnToiletGap:[10,85], outMigration:[25000,225000], interStateMig:[100,6000] };
  function clampNorm(key, v){
    const r = RANGES[key]; if(!r) return 0.5;
    return Math.max(0, Math.min(1, (v - r[0]) / (r[1] - r[0])));
  }

  function overallIndex(did){
    const n = metricNorm(did,'overall');
    return Math.round(n*100);
  }

  // ----- load geometry -----
  // Official-boundary supplement: Natural Earth draws India's de-facto line, which
  // omits much of Jammu & Kashmir. This polygon covers the full region up to India's
  // official (Survey of India) claim line — J&K, Gilgit-Baltistan and Aksai Chin —
  // and is merged seamlessly into the India shape (no internal dispute line drawn).
  const kashmirClaim = { type:'Feature', properties:{name:'Jammu & Kashmir (official boundary)'}, geometry:{ type:'Polygon', coordinates:[[
    [74.4,36.9],[75.0,37.0],[75.6,36.75],[76.2,36.7],[76.9,36.2],[77.45,35.9],[78.1,35.5],
    [78.35,35.6],[79.0,35.5],[79.9,35.4],[80.3,35.2],[80.25,34.7],[79.9,34.4],[79.6,34.0],
    [79.4,33.4],[78.95,33.15],[78.75,32.65],[78.35,32.55],[77.85,32.4],[77.0,32.5],[76.3,32.3],
    [75.6,32.25],[75.0,32.45],[74.55,32.3],[74.35,32.75],[74.05,33.1],[74.2,33.5],[73.95,33.75],
    [74.25,34.0],[73.85,34.35],[73.5,34.55],[73.75,34.95],[74.15,35.2],[74.35,35.6],[74.05,35.9],
    [73.8,36.15],[74.05,36.6],[74.4,36.9]
  ]] } };
  d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json').then(topo => {
    const feats = topojson.feature(topo, topo.objects.countries).features;
    indiaFeature = feats.find(f => f.properties.name === 'India');
    ctxFeatures = feats.filter(f => ['Pakistan','Nepal','Bangladesh','China','Bhutan','Myanmar','Sri Lanka','Afghanistan'].includes(f.properties.name));
    layout(); render();
  }).catch(()=>{ layout(); render(); });

  function layout(){
    W = mapcol.clientWidth; H = mapcol.clientHeight;
    svg.attr('viewBox', `0 0 ${W} ${H}`);
    if (indiaFeature) projection.fitExtent([[W*0.05,H*0.05],[W*0.95,H*0.95]], { type:'FeatureCollection', features:[indiaFeature, kashmirClaim] });
  }

  function render(){
    // context
    gCtx.selectAll('path').data(ctxFeatures||[]).join('path')
      .attr('d', path).attr('fill','var(--ctx)').attr('stroke','var(--bg)').attr('stroke-width',0.6);
    // india — official boundary: administered shape + J&K/claim region drawn as one
    // unbroken fill (no stroke on either path, so no internal line appears along the LoC);
    // the outline comes from a drop-shadow on the group, which follows the union silhouette.
    gIndia.style('filter','drop-shadow(0 0 1.2px rgba(150,133,111,.95))');
    gIndia.selectAll('path').data(indiaFeature?[kashmirClaim, indiaFeature]:[]).join('path')
      .attr('d', path).attr('fill','var(--land)').attr('stroke','none').attr('opacity',1);
    renderPoints();
    buildToolbar(); buildLegend(); buildPlaceholder();
  }

  function rFor(did){ const base = Math.max(6, Math.min(W,H)*0.012); const n = metricNorm(did,selMetric); return base * (0.7 + (n==null?0.4:n)*1.1); }

  function renderPoints(){
    const pts = A.districts.map(d => ({ d, xy: projection([d.lng,d.lat]) })).filter(p=>p.xy);
    const sel = gPts.selectAll('g.dg').data(pts, p=>p.d.id);
    const enter = sel.enter().append('g').attr('class','dg');
    enter.append('circle').attr('class','hit').attr('fill','transparent').style('cursor','pointer');
    enter.append('circle').attr('class','prio-ring').attr('fill','none').attr('stroke','#EAAE28');
    enter.append('circle').attr('class','district').style('pointer-events','none');
    enter.append('text').attr('class','dlabel');
    const all = enter.merge(sel);
    all.attr('transform', p => `translate(${p.xy[0]},${p.xy[1]})`)
       .attr('opacity', p => isVisible(p.d)?1:0.15)
       .style('pointer-events', p => isVisible(p.d)?'auto':'none');
    all.select('circle.prio-ring').attr('display', p => p.d.tier==='priority'?null:'none');
    all.select('circle.district')
      .attr('r', p => rFor(p.d.id))
      .attr('fill', p => { const n = metricNorm(p.d.id, selMetric); return n==null? 'var(--faint)' : sevColor(n); })
      .attr('fill-opacity', 0.88)
      .attr('stroke', p => cmpSet.includes(p.d.id) ? '#EAAE28' : (selected===p.d.id ? '#fff' : 'var(--bg)'))
      .attr('stroke-width', p => (cmpSet.includes(p.d.id)||selected===p.d.id) ? 3 : 1.5);
    all.select('text.dlabel')
      .attr('x', 0)
      .attr('text-anchor','middle')
      .text(p => p.d.name.replace(/ \(.*/,''));
    all.on('mouseenter', (e,p)=>showTip(e,p.d))
       .on('mousemove', (e,p)=>moveTip(e))
       .on('mouseleave', hideTip)
       .on('click', (e,p)=>{ e.stopPropagation(); if(cmpMode){ toggleCompare(p.d.id); } else { selectDistrict(p.d.id); zoomTo(p.d); if(rankOpen) buildRank(); } });
    sizeNodes();
  }

  function sizeNodes(){
    const k = (d3.zoomTransform(svg.node()).k) || 1;
    gPts.selectAll('g.dg').each(function(p){
      const g = d3.select(this);
      g.select('circle.hit')
        .attr('r', Math.max(rFor(p.d.id)+9, TOUCH?26:18)/k);
      g.select('circle.district')
        .attr('r', rFor(p.d.id)/k)
        .attr('stroke-width', ((cmpSet.includes(p.d.id)||selected===p.d.id)?3:1.5)/k);
      g.select('circle.prio-ring')
        .attr('r', (rFor(p.d.id)+4.5)/k)
        .attr('stroke-width', 1.4/k)
        .attr('stroke-dasharray', `${4/k} ${3/k}`);
      g.select('text.dlabel')
        .style('font-size', (11/k)+'px')
        .style('stroke-width', (3/k)+'px')
        .style('opacity', (selected===p.d.id || k>=2.2) ? 1 : 0)
        .attr('y', (-rFor(p.d.id)-5)/k);
    });
  }

  function showTip(e,d){
    const idx = overallIndex(d.id);
    tt.innerHTML = `<b>${d.name}</b><br>${d.state}${d.aspirational?' · Aspirational District':''}<br><span style="color:var(--faint)">Opportunity Gap Index</span> <b style="color:${sevColor(idx/100)}">${idx}</b>`+
      (d.tier==='priority'
        ? `<br><span style="color:#EAAE28;font-weight:700">★ Priority — in-depth, intersectional investment</span>`
        : `<br><span style="color:var(--faint)">Programme Footprint — past &amp; ongoing projects</span>`)+
      (cmpMode?`<br><span style="color:var(--faint)">Tap to ${cmpSet.includes(d.id)?'remove from':'add to'} comparison</span>`:'');
    tt.style.opacity=1; moveTip(e);
  }
  function moveTip(e){
    const r = mapcol.getBoundingClientRect();
    let x = e.clientX - r.left + 14, y = e.clientY - r.top + 14;
    if (x > r.width-230) x = e.clientX - r.left - 230;
    tt.style.left = x+'px'; tt.style.top = y+'px';
  }
  function hideTip(){ tt.style.opacity=0; }

  // ----- zoom -----
  const zoom = d3.zoom().scaleExtent([1,20]).on('zoom', (ev)=>{
    const t = ev.transform;
    gCtx.attr('transform', t); gIndia.attr('transform', t);
    gPts.attr('transform', t);
    sizeNodes();
  });
  svg.call(zoom).on('dblclick.zoom', null);

  function zoomTo(d){
    const [x,y] = projection([d.lng,d.lat]);
    const k = 7;
    const t = d3.zoomIdentity.translate(W/2, H/2).scale(k).translate(-x,-y);
    svg.transition().duration(900).call(zoom.transform, t);
  }
  function resetView(){ selected=null; renderPoints();
    if(cmpMode){ renderCompare(); } else { buildPlaceholder(); document.getElementById('panel').classList.remove('open'); }
    svg.transition().duration(700).call(zoom.transform, d3.zoomIdentity); }

  document.getElementById('homeBtn').onclick = resetView;
  document.getElementById('panelClose').onclick = resetView;
  const TOUCH = window.matchMedia('(pointer:coarse)').matches;
  if (window.innerWidth <= 860) { const lg=document.getElementById('legend'); if(lg) lg.classList.add('min'); }
  document.getElementById('zoomIn').onclick = ()=> svg.transition().duration(250).call(zoom.scaleBy,1.5);
  document.getElementById('zoomOut').onclick = ()=> svg.transition().duration(250).call(zoom.scaleBy,1/1.5);
  document.getElementById('themeBtn').onclick = ()=>{
    const nx = rootEl.getAttribute('data-theme')==='dark'?'light':'dark';
    rootEl.setAttribute('data-theme', nx);
    document.getElementById('themeBtn').textContent = nx==='dark'?'☀':'☾';
    renderPoints();
  };
  // live theme sync from parent site
  window.addEventListener('message', (e)=>{ if(e.data && e.data.theme){ rootEl.setAttribute('data-theme', e.data.theme); document.getElementById('themeBtn').textContent = e.data.theme==='dark'?'☀':'☾'; renderPoints(); } });

  svg.on('click', ()=>{ /* background click keeps selection */ });
  window.addEventListener('resize', ()=>{ layout(); render(); if(selected){ const d=A.districts.find(x=>x.id===selected); if(d) zoomTo(d);} });

  // ----- toolbar (metric selector, in the top bar) -----
  function buildToolbar(){
    const sel = document.getElementById('metricSel');
    const metrics = [{key:'overall',label:'Overall Opportunity Gap'}].concat(
      A.indicators.filter(i=>i.worseHigh).map(i=>({key:i.key,label:i.label})));
    if(!sel.dataset.built){
      sel.innerHTML = metrics.map(m=>`<option value="${m.key}">${m.label}</option>`).join('');
      sel.dataset.built='1';
      sel.onchange = ()=>{ selMetric=sel.value; renderPoints(); buildLegend(); if(rankOpen) buildRank(); };
    }
    sel.value = selMetric;
  }
  function buildLegend(){
    const ind = A.indicators.find(i=>i.key===selMetric);
    const title = selMetric==='overall' ? 'Overall Child Opportunity Gap Index' : ind.label;
    const src = selMetric==='overall' ? `Composite of ${gapKeys.length} gap indicators` : ('Source: '+ind.source);
    const leg = document.getElementById('legend');
    leg.style.display = rankOpen ? 'none' : '';
    const wasMin = leg.classList.contains('min');
    leg.innerHTML =
      `<div class="leg-head"><span class="leg-title">${title}</span><button class="leg-toggle" aria-label="Toggle legend">${wasMin?'+':'−'}</button></div>`+
      `<div class="leg-body"><div class="legbar"></div>`+
      `<div style="display:flex;justify-content:space-between"><span>At the benchmark</span><span>Furthest from it</span></div>`+
      `<div style="margin-top:6px">${src}</div>`+
      `<div style="margin-top:6px"><span style="color:#EAAE28">★ Dashed Ring</span> = Priority District — DEHAT\u2019s deepest current investment. Plain dots = Programme Footprint.</div></div>`;
    leg.querySelector('.leg-toggle').onclick = ()=>{
      const min = leg.classList.toggle('min');
      leg.querySelector('.leg-toggle').textContent = min?'+':'−';
    };
  }

  function buildPlaceholder(){
    if (selected) return;
    const body = document.getElementById('panelBody');
    let ph = document.getElementById('ph');
    if (!ph){ body.innerHTML = '<div class="placeholder" id="ph"></div>'; ph = document.getElementById('ph'); }
    ph.innerHTML =
      `<b style="font-size:22px;display:block;margin-bottom:10px">Why here?</b>`+
      `Every district on this map is a place DEHAT works, accompanied by its communities — three under our deepest, intersectional investment, a fourth \u2014 Lakhimpur Kheri \u2014 entered in 2026 for child protection, and the rest across two decades of programme presence. `+
      `Tap any district to open its full child profile: each indicator, its value and its named source, grouped along the vulnerability cycle. `+
      `Shade the map by any of ${A.indicators.filter(i=>i.worseHigh).length} indicators, filter by state or presence, rank the districts, or compare two side by side.`+
      `<div class="disclaim" style="border-left:2px solid #EAAE28;padding-left:14px"><b style="color:var(--text)">How the index is built.</b> Each indicator is scored as a distance from the best-performing district in this set, then averaged into a single 0\u2013100 figure. A district at 0 sits where the strongest district here sits; 100 is the furthest anyone in the set falls from it. Because the benchmark is a real district and not a national ideal, every point on the scale is a distance that has already been closed somewhere. The index decides where DEHAT goes next, and it is the same figure the work is reported back against \u2014 a district that improves should move down it.<br><br><b style="color:var(--text)">What an index is, and is not.</b> It is not a verdict on a place or its people. It is a measure of how far a public system sits from what it already promises, expressed as one number so that every district here can be compared honestly and priorities can be argued with rather than asserted.</div>`+
      `<div class="disclaim"><b style="color:var(--text)">On the data.</b> Every figure is drawn from DEHAT's Vulnerability Index — ${A.indicators.length} indicators across ${A.districts.length} districts, each traced to a named source: the NFHS-5 (2019\u201321) district fact-sheet dataset (MoHFW / IIPS) for health, nutrition, WASH and gender; UDISE+ district fact sheets for schooling and child migration; SRS for maternal mortality, which is state-level by construction; and NITI Aayog / Jal Shakti / HMIS records for the remainder. The seven schooling &amp; mobility indicators are tagged by their link to the Structural Vulnerability Cycle — <b style="color:var(--text)">direct</b> (labour, trafficking, exploitation), <b style="color:var(--text)">indirect</b> (retention &amp; school conditions) or <b style="color:var(--text)">intersectional</b> (overlapping caste, tribe, minority, disability &amp; gender disadvantage). Migration is a student-volume count, so it is shown and shadeable but held out of the composite index. Every health, nutrition, WASH and gender figure comes from a single survey round, so districts are compared like with like. Spousal violence is collected in the NFHS state module only and is shown as the state figure everywhere. `+
      `Maternal mortality is reported at state level, badged as such. Every value carries the sheet it came from. Nine indicators \u2014 child labour, ICDS reach, PHC proximity, lowest wealth quintile, SC+ST share, girls\u2019 dropout, secondary-stage dropout, and infant and under-5 mortality \u2014 are still carried from the Vulnerability Index workbook and await re-verification against their cited originals.</div>`;
  }

  // ----- deep-dive panel -----
  function selectDistrict(did){
    selected = did; renderPoints();
    const d = A.districts.find(x=>x.id===did);
    const panel = document.getElementById('panel');
    const body = document.getElementById('panelBody');
    panel.classList.add('open');
    const idx = overallIndex(did);
    let html = `<div class="p-pad">`;
    html += `<div class="p-head"><span class="eyebrow" style="color:#EAAE28">${d.state}${d.aspirational?' · Aspirational District':''}</span>`+
            `<h1>${d.name}</h1><div class="p-sub">District HQ: ${d.hq}</div></div>`;
    html += `<div class="vindex"><div class="num" style="color:${sevColor(idx/100)}">${idx}</div>`+
            `<div><div style="font-weight:700;font-size:13px">Child Opportunity Gap Index</div>`+
            `<div style="font-size:12px;color:var(--faint)">0 (at the benchmark district) → 100 (furthest from it). Composite of ${gapKeys.length} sourced gap indicators.</div></div></div>`;
    if (d.scope) html += `<div class="prio-band">★ ${d.scope}</div>`;
    else if (d.tier==='priority') html += `<div class="prio-band">★ Priority District — in-depth, intersectional investment across all four programmes.</div>`;
    else html += `<div class="prio-band" style="background:var(--surface2);border-color:var(--border);color:var(--faint)">Programme Footprint — DEHAT has worked here through past &amp; ongoing projects; tracked in the Vulnerability Index.</div>`;
    html += `<p class="why">${d.why}</p>`;

    A.nodes.forEach(node=>{
      const inds = A.indicators.filter(i=>i.node===node.id);
      html += `<div class="nodeblock"><h3><span style="width:9px;height:9px;border-radius:50%;background:${node.color};display:inline-block"></span>${node.label}</h3>`+
              `<p class="nb-blurb">${node.blurb}</p>`;
      inds.forEach(ind=>{
        const r = A.value(did, ind.key);
        const bU = A.bench.up[ind.key], bI = A.bench.india[ind.key], bM = A.bench.mh[ind.key];
        const stateBench = d.sb==='mh'? bM : bU;
        const stateLbl = d.sb==='mh'?'MH':'UP';
        const badge = r.kind==='exact' ? `<span class="badge b-exact">District · Exact</span>`
                    : r.kind==='state' ? `<span class="badge b-state">${stateLbl} Benchmark</span>`
                    : `<span class="badge b-na">Factsheet Pending</span>`;
        const valTxt = fmtVal(ind, r.v);
        const valColor = (ind.worseHigh && r.v!=null) ? sevColor(clampNorm(ind.key,r.v)) : 'var(--text)';
        html += `<div class="ind"><div class="ind-top"><div class="ind-label">${ind.label}</div>`+
                `<div class="ind-val" style="color:${valColor}">${valTxt}</div></div>`+
                `<div class="ind-interp">${ind.interp}</div>`;
        if (ind.worseHigh && r.v!=null){
          const rng = RANGES[ind.key]||[0,100];
          const pct = Math.max(3, Math.min(100, clampNorm(ind.key,r.v)*100));
          html += `<div class="bar"><span style="width:${pct}%;background:${valColor}"></span></div>`;
          const markPct = (val)=> val==null?null:Math.max(0,Math.min(100,((val-rng[0])/(rng[1]-rng[0]))*100));
          const mUP = markPct(bU), mIN = markPct(bI);
          html += `<div class="bar-marks">`;
          if(mUP!=null) html += `<span class="bar-mark" style="left:${mUP}%">UP ${bU}</span>`;
          if(mIN!=null) html += `<span class="bar-mark b2" style="left:${mIN}%">India ${bI}</span>`;
          html += `</div>`;
        }
        html += `<div class="srcrow"><span class="src">Source: ${r.src || ind.source}</span>${badge}</div></div>`;
      });
      html += `</div>`;
    });
    html += `<div class="disclaim" style="margin-top:20px"><b style="color:var(--text)">Reading the badges.</b> `+
            `<span class="badge b-exact">District · Exact</span> = the district's own value from the Vulnerability Index. `+
            `<span class="badge b-state">Benchmark</span> = the state average, shown where the matrix has no district figure for this indicator. `+
            `Bars set this district against the UP and India averages.</div>`;
    html += `</div>`;
    body.innerHTML = html;
    panel.scrollTop = 0;
  }

  // ----- nav: search / state / priority / ranking / compare -----
  const searchIn=document.getElementById('searchIn'), suggest=document.getElementById('suggest');
  function jumpTo(d){ if(cmpMode){ toggleCompare(d.id); } else { selectDistrict(d.id); zoomTo(d); if(rankOpen) buildRank(); } }
  searchIn.addEventListener('input', ()=>{
    const q=searchIn.value.trim().toLowerCase();
    if(!q){ suggest.style.display='none'; return; }
    const hits=A.districts.filter(d=>d.name.toLowerCase().includes(q)||d.state.toLowerCase().includes(q)).slice(0,6);
    suggest.innerHTML = hits.length? hits.map(d=>`<button data-id="${d.id}"><b>${d.name}</b><span>${d.state}${d.tier==='priority'?' · ★':''}</span></button>`).join('') : '<div class="nohit">No matching district</div>';
    suggest.style.display='block';
    suggest.querySelectorAll('button').forEach(b=> b.onclick=()=>{ const d=A.districts.find(x=>x.id===b.dataset.id); searchIn.value=''; suggest.style.display='none'; jumpTo(d); });
  });
  searchIn.addEventListener('keydown', e=>{ if(e.key==='Enter'){ const b=suggest.querySelector('button'); if(b) b.click(); } });
  document.addEventListener('click', e=>{ if(!e.target.closest('.searchwrap')) suggest.style.display='none'; });

  document.getElementById('stateSel').onchange = e=>{ stateFilter=e.target.value; renderPoints(); if(rankOpen) buildRank(); };
  document.getElementById('tierSel').onchange = e=>{ tierFilter=e.target.value; renderPoints(); if(rankOpen) buildRank(); };
  const rankBtn=document.getElementById('rankBtn'), rankbox=document.getElementById('rankbox');
  rankBtn.onclick=()=>{ rankOpen=!rankOpen; rankBtn.classList.toggle('on',rankOpen); rankbox.style.display=rankOpen?'block':'none'; document.getElementById('legend').style.display=rankOpen?'none':''; if(rankOpen) buildRank(); };
  const cmpBtn=document.getElementById('cmpBtn');
  cmpBtn.onclick=()=>{ cmpMode=!cmpMode; cmpBtn.classList.toggle('on',cmpMode);
    if(!cmpMode){ cmpSet=[]; buildPlaceholder(); document.getElementById('panel').classList.remove('open'); }
    else { selected=null; renderCompare(); }
    renderPoints(); };

  function metricVal(did){
    if(selMetric==='overall'){ const v=overallIndex(did); return {v, txt:String(v)}; }
    const r=A.value(did,selMetric); const ind=A.indicators.find(i=>i.key===selMetric);
    return {v:r.v==null?-1:r.v, txt:fmtVal(ind,r.v), kind:r.kind};
  }
  function buildRank(){
    const rows=A.districts.filter(isVisible).map(d=>({d, m:metricVal(d.id)}));
    rows.sort((a,b)=> rankSort.key==='name'
      ? (rankSort.asc? a.d.name.localeCompare(b.d.name) : b.d.name.localeCompare(a.d.name))
      : (rankSort.asc? a.m.v-b.m.v : b.m.v-a.m.v));
    const ind=A.indicators.find(i=>i.key===selMetric);
    const title = selMetric==='overall'?'Index':ind.label;
    const arrow = k => rankSort.key===k ? (rankSort.asc?' ↑':' ↓') : '';
    rankbox.innerHTML =
      `<div class="rk-head"><button data-k="name">District${arrow('name')}</button><button data-k="val">${title}${arrow('val')}</button></div>`+
      rows.map((r,i)=>`<button class="rk-row${selected===r.d.id?' sel':''}" data-id="${r.d.id}">`+
        `<span class="rk-n">${i+1}</span><span class="rk-name">${r.d.name}${r.d.tier==='priority'?' <b style="color:#EAAE28">★</b>':''}<small>${r.d.state}</small></span>`+
        `<span class="rk-val" style="color:${selMetric==='overall'?sevColor(r.m.v/100):(r.m.v<0?'var(--faint)':sevColor(clampNorm(selMetric,r.m.v)))}">${r.m.txt}</span></button>`).join('');
    rankbox.querySelectorAll('.rk-head button').forEach(b=> b.onclick=()=>{ const k=b.dataset.k; if(rankSort.key===k) rankSort.asc=!rankSort.asc; else rankSort={key:k, asc:k==='name'}; buildRank(); });
    rankbox.querySelectorAll('.rk-row').forEach(b=> b.onclick=()=>{ const d=A.districts.find(x=>x.id===b.dataset.id); jumpTo(d); });
  }

  function toggleCompare(did){
    const i=cmpSet.indexOf(did);
    if(i>=0) cmpSet.splice(i,1); else { cmpSet.push(did); if(cmpSet.length>2) cmpSet.shift(); }
    renderPoints(); renderCompare();
  }
  function renderCompare(){
    const panel=document.getElementById('panel'); const body=document.getElementById('panelBody'); panel.classList.add('open');
    if(cmpSet.length<2){
      body.innerHTML=`<div class="placeholder"><b style="font-size:22px;display:block;margin-bottom:10px">Compare Districts</b>`+
        `Tap two districts on the map — or pick them from the ranking table or search — to see every indicator side by side.`+
        (cmpSet.length===1?`<div class="disclaim">Selected: <b style="color:var(--text)">${A.districts.find(x=>x.id===cmpSet[0]).name}</b> — pick one more.</div>`:'')+`</div>`;
      return;
    }
    const [a,b]=cmpSet.map(id=>A.districts.find(x=>x.id===id));
    let html=`<div class="p-pad"><span class="eyebrow" style="color:#EAAE28">Compare</span>`+
      `<h1 style="font-family:'Bricolage Grotesque';font-weight:800;font-size:23px;line-height:1.1;letter-spacing:-.02em;margin:8px 0 2px">${a.name} · ${b.name}</h1>`+
      `<div class="p-sub">Opportunity Gap Index: ${a.name} <b style="color:${sevColor(overallIndex(a.id)/100)}">${overallIndex(a.id)}</b> · ${b.name} <b style="color:${sevColor(overallIndex(b.id)/100)}">${overallIndex(b.id)}</b></div>`+
      `<div class="cmp-row cmp-headrow"><div class="cmp-label"></div><div class="cmp-vals"><span>${a.name.replace(/ \(.*/,'')}</span><span>${b.name.replace(/ \(.*/,'')}</span></div></div>`;
    A.nodes.forEach(node=>{
      const inds=A.indicators.filter(i=>i.node===node.id);
      html+=`<div class="nodeblock"><h3><span style="width:9px;height:9px;border-radius:50%;background:${node.color};display:inline-block"></span>${node.label}</h3>`;
      inds.forEach(ind=>{
        const ra=A.value(a.id,ind.key), rb=A.value(b.id,ind.key);
        const fa=fmtVal(ind,ra.v), fb=fmtVal(ind,rb.v);
        let worse=null;
        if(ind.worseHigh && ra.v!=null && rb.v!=null && ra.v!==rb.v) worse = ra.v>rb.v?'a':'b';
        html+=`<div class="cmp-row"><div class="cmp-label">${ind.label}</div>`+
          `<div class="cmp-vals"><span class="cmp-v${worse==='a'?' worse':''}">${fa}${ra.kind==='state'?'<i>†</i>':''}</span>`+
          `<span class="cmp-v${worse==='b'?' worse':''}">${fb}${rb.kind==='state'?'<i>†</i>':''}</span></div></div>`;
      });
      html+=`</div>`;
    });
    html+=`<div class="disclaim" style="margin-top:18px">† state benchmark shown — indicator not in the district matrix. The <span style="color:#D2305C;font-weight:700">highlighted</span> value is the worse of the pair on gap indicators.</div></div>`;
    body.innerHTML=html; panel.scrollTop=0;
  }
})();
</script>
</body>
</html>
